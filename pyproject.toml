[project]
name = "smtp-to-matrix"
version = "0.1.0"
description = "An SMTP server that forwards received mail to a Matrix room."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4",
    "croniter>=6.2.4",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.scripts]
smtp-to-matrix = "smtp_to_matrix.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smtp_to_matrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
